<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game of Life</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: #0a0a0a;
    color: #ccc;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: row;
    width: 100vw;
    height: 100vh;
    position: fixed;
    top: 0;
    left: 0;
  }

  #c {
    display: block;
    flex: 1 1 auto;
    height: 100%;
    cursor: crosshair;
  }

  #sidebar {
    width: 220px;
    flex-shrink: 0;
    height: 100%;
    background: #111;
    border-left: 1px solid #222;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    padding: 16px 14px;
  }

  .title {
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 4px;
    color: #fff;
    text-transform: uppercase;
    margin-bottom: 4px;
    padding-bottom: 14px;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
  }

  .gen-counter {
    font-size: 11px;
    letter-spacing: 1px;
    color: #555;
    text-transform: uppercase;
    margin-top: -2px;
    margin-bottom: 2px;
  }

  .gen-counter span {
    color: #888;
  }

  button {
    background: #1a1a1a;
    border: 1px solid #333;
    color: #ccc;
    padding: 7px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 1px;
    transition: background 0.1s, color 0.1s;
    width: 100%;
    text-align: left;
    flex-shrink: 0;
  }

  button:hover {
    background: #252525;
    color: #fff;
  }

  #btn-playpause {
    border-color: #4a4;
    color: #6d6;
    font-size: 14px;
    padding: 10px 16px;
  }

  #btn-playpause:hover, #btn-playpause.active {
    background: #1a2e1a;
    color: #8f8;
  }

  #btn-clear {
    border-color: #a44;
    color: #d66;
  }

  #btn-clear:hover {
    background: #2e1a1a;
    color: #f88;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex-shrink: 0;
  }

  .control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .control-label {
    color: #888;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .control-value {
    color: #fff;
    font-size: 12px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: #333;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #888;
    cursor: pointer;
    transition: background 0.1s;
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    background: #bbb;
  }

  .divider {
    border-top: 1px solid #222;
    margin: 2px 0;
    flex-shrink: 0;
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 1px;
    color: #555;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .btn-pattern {
    border-color: #334;
    color: #99a;
    padding: 6px 16px;
  }

  .btn-pattern:hover {
    background: #1a1a2e;
    color: #bbf;
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="sidebar">
    <div class="title">Game of Life</div>
    <div class="gen-counter">Gen <span id="gen-display">0</span></div>

    <button id="btn-playpause">&#9654; PLAY</button>
    <button id="btn-step">STEP</button>

    <div class="control-group">
      <div class="control-row">
        <span class="control-label">Speed</span>
        <span class="control-value" id="speed-display">10 /s</span>
      </div>
      <input type="range" id="speed-slider" min="1" max="60" value="10">
    </div>

    <button id="btn-random">RANDOMIZE</button>
    <button id="btn-clear">CLEAR</button>

    <div class="divider"></div>
    <div class="section-label">Patterns</div>

    <button class="btn-pattern" data-pattern="glider">Glider</button>
    <button class="btn-pattern" data-pattern="blinker">Blinker</button>
    <button class="btn-pattern" data-pattern="pulsar">Pulsar</button>
    <button class="btn-pattern" data-pattern="gosper">Gosper Gun</button>
    <button class="btn-pattern" data-pattern="lwss">LWSS</button>
  </div>
</div>

<script>
  const CELL_SIZE = 10;
  const SIDEBAR_W = 220;

  const PALETTE = [
    '#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c',
    '#3498db','#9b59b6','#e91e63','#00bcd4','#ff9800'
  ];

  const PALETTE_RGB = PALETTE.map(hex => ({
    r: parseInt(hex.slice(1,3), 16),
    g: parseInt(hex.slice(3,5), 16),
    b: parseInt(hex.slice(5,7), 16),
  }));

  const PATTERNS = {
    glider: [
      [0, 1],
      [1, 2],
      [2, 0],[2, 1],[2, 2]
    ],

    blinker: [
      [0,-1],[0, 0],[0, 1]
    ],

    pulsar: [
      [-6,-4],[-6,-3],[-6,-2],[-6, 2],[-6, 3],[-6, 4],
      [-4,-6],[-4,-1],[-4, 1],[-4, 6],
      [-3,-6],[-3,-1],[-3, 1],[-3, 6],
      [-2,-6],[-2,-1],[-2, 1],[-2, 6],
      [-1,-4],[-1,-3],[-1,-2],[-1, 2],[-1, 3],[-1, 4],
      [ 1,-4],[ 1,-3],[ 1,-2],[ 1, 2],[ 1, 3],[ 1, 4],
      [ 2,-6],[ 2,-1],[ 2, 1],[ 2, 6],
      [ 3,-6],[ 3,-1],[ 3, 1],[ 3, 6],
      [ 4,-6],[ 4,-1],[ 4, 1],[ 4, 6],
      [ 6,-4],[ 6,-3],[ 6,-2],[ 6, 2],[ 6, 3],[ 6, 4],
    ],

    gosper: (function() {
      const raw = [
        [0,24],
        [1,22],[1,24],
        [2,12],[2,13],[2,20],[2,21],[2,34],[2,35],
        [3,11],[3,15],[3,20],[3,21],[3,34],[3,35],
        [4, 0],[4, 1],[4,10],[4,16],[4,20],[4,21],
        [5, 0],[5, 1],[5,10],[5,14],[5,16],[5,17],[5,22],[5,24],
        [6,10],[6,16],[6,24],
        [7,11],[7,15],
        [8,12],[8,13],
      ];
      return raw.map(([r, c]) => [r - 4, c - 18]);
    })(),

    lwss: [
      [0, 1],[0, 4],
      [1, 0],
      [2, 0],[2, 4],
      [3, 0],[3, 1],[3, 2],[3, 3],
    ],
  };

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let cols, rows;
  let cellsCur, cellsNxt;
  let ageCur, ageNxt;

  let isRunning = false;
  let genPerSec = 10;
  let lastGenTime = 0;
  let generation = 0;

  let isPainting = false;
  let paintValue = 1;
  let lastPaintedCell = -1;

  function initGrid() {
    const canvasW = window.innerWidth - SIDEBAR_W;
    const canvasH = window.innerHeight;
    canvas.width  = canvasW;
    canvas.height = canvasH;

    cols = Math.floor(canvasW / CELL_SIZE);
    rows = Math.floor(canvasH / CELL_SIZE);

    const n = cols * rows;
    cellsCur = new Uint8Array(n);
    cellsNxt = new Uint8Array(n);
    ageCur   = new Uint32Array(n);
    ageNxt   = new Uint32Array(n);
    generation = 0;
    updateGenDisplay();
  }

  function step() {
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const idx = r * cols + c;
        let n = 0;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
            n += cellsCur[nr * cols + nc];
          }
        }
        const alive = cellsCur[idx];
        if (alive) {
          const survives = (n === 2 || n === 3) ? 1 : 0;
          cellsNxt[idx] = survives;
          ageNxt[idx]   = survives ? ageCur[idx] + 1 : 0;
        } else {
          const born = (n === 3) ? 1 : 0;
          cellsNxt[idx] = born;
          ageNxt[idx]   = born ? 1 : 0;
        }
      }
    }
    const tmpC = cellsCur; cellsCur = cellsNxt; cellsNxt = tmpC;
    const tmpA = ageCur;   ageCur   = ageNxt;   ageNxt   = tmpA;
    generation++;
    updateGenDisplay();
  }

  function render() {
    const w = canvas.width;
    const h = canvas.height;
    const imgData = ctx.createImageData(w, h);
    const buf = imgData.data;

    // Pre-fill background #0a0a0a
    for (let i = 0; i < buf.length; i += 4) {
      buf[i] = 0x0a; buf[i+1] = 0x0a; buf[i+2] = 0x0a; buf[i+3] = 255;
    }

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const idx = r * cols + c;
        if (!cellsCur[idx]) continue;

        const ci = (ageCur[idx] - 1) % 10;
        const { r: rr, g: gg, b: bb } = PALETTE_RGB[ci];

        const px0 = c * CELL_SIZE;
        const py0 = r * CELL_SIZE;
        const pxEnd = px0 + CELL_SIZE - 1;
        const pyEnd = py0 + CELL_SIZE - 1;

        for (let py = py0; py < pyEnd; py++) {
          for (let px = px0; px < pxEnd; px++) {
            const off = (py * w + px) * 4;
            buf[off]     = rr;
            buf[off + 1] = gg;
            buf[off + 2] = bb;
            buf[off + 3] = 255;
          }
        }
      }
    }

    ctx.putImageData(imgData, 0, 0);
  }

  function loop(ts) {
    requestAnimationFrame(loop);

    if (isRunning) {
      const interval = 1000 / genPerSec;
      if (ts - lastGenTime >= interval) {
        step();
        lastGenTime = ts;
      }
    }
    render();
  }

  function updateGenDisplay() {
    document.getElementById('gen-display').textContent = generation;
  }

  function eventToIndex(e) {
    const rect = canvas.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left) / CELL_SIZE);
    const r = Math.floor((e.clientY - rect.top)  / CELL_SIZE);
    if (c < 0 || c >= cols || r < 0 || r >= rows) return -1;
    return r * cols + c;
  }

  function setCellAt(idx, val) {
    cellsCur[idx] = val;
    ageCur[idx]   = val ? 1 : 0;
  }

  function randomize() {
    for (let i = 0; i < cellsCur.length; i++) {
      const alive = Math.random() < 0.30 ? 1 : 0;
      cellsCur[i] = alive;
      ageCur[i]   = alive ? 1 : 0;
    }
    cellsNxt.fill(0);
    ageNxt.fill(0);
    generation = 0;
    updateGenDisplay();
  }

  function stampPattern(name) {
    const offsets = PATTERNS[name];
    if (!offsets) return;

    const cr = Math.floor(rows / 2);
    const cc = Math.floor(cols / 2);

    for (const [dr, dc] of offsets) {
      const r = cr + dr, c = cc + dc;
      if (r < 0 || r >= rows || c < 0 || c >= cols) continue;
      const idx = r * cols + c;
      cellsCur[idx] = 1;
      ageCur[idx]   = 1;
    }
  }

  function initControls() {
    const btnPlay = document.getElementById('btn-playpause');

    btnPlay.addEventListener('click', () => {
      isRunning = !isRunning;
      btnPlay.textContent = isRunning ? '⏸ PAUSE' : '▶ PLAY';
      btnPlay.classList.toggle('active', isRunning);
    });

    document.getElementById('btn-step').addEventListener('click', () => {
      if (!isRunning) step();
    });

    const speedSlider  = document.getElementById('speed-slider');
    const speedDisplay = document.getElementById('speed-display');
    speedSlider.addEventListener('input', () => {
      genPerSec = parseInt(speedSlider.value, 10);
      speedDisplay.textContent = genPerSec + ' /s';
    });

    document.getElementById('btn-random').addEventListener('click', randomize);

    document.getElementById('btn-clear').addEventListener('click', () => {
      cellsCur.fill(0); ageCur.fill(0);
      cellsNxt.fill(0); ageNxt.fill(0);
      generation = 0;
      updateGenDisplay();
    });

    document.querySelectorAll('.btn-pattern').forEach(btn => {
      btn.addEventListener('click', () => stampPattern(btn.dataset.pattern));
    });

    canvas.addEventListener('mousedown', e => {
      const idx = eventToIndex(e);
      if (idx < 0) return;
      isPainting = true;
      paintValue = cellsCur[idx] ? 0 : 1;
      setCellAt(idx, paintValue);
      lastPaintedCell = idx;
    });

    canvas.addEventListener('mousemove', e => {
      if (!isPainting) return;
      const idx = eventToIndex(e);
      if (idx < 0 || idx === lastPaintedCell) return;
      setCellAt(idx, paintValue);
      lastPaintedCell = idx;
    });

    window.addEventListener('mouseup', () => { isPainting = false; });

    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        btnPlay.click();
      }
    });

    window.addEventListener('resize', () => {
      initGrid();
    });
  }

  initGrid();
  initControls();
  requestAnimationFrame(loop);
</script>
</body>
</html>
