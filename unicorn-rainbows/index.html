<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Unicorn Rainbows</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 60%, #90EE90 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: none;
    }
    canvas { display: block; }
    #score {
      position: absolute;
      top: 20px; left: 50%;
      transform: translateX(-50%);
      font-size: 3rem;
      color: #fff;
      text-shadow: 2px 2px 0 #333;
      pointer-events: none;
    }
    #hint {
      position: absolute;
      top: 35%; left: 0; width: 100%;
      text-align: center;
      font-size: 2rem;
      color: #fff;
      text-shadow: 2px 2px 0 #333;
      pointer-events: none;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="score">0</div>
  <div id="hint">🦄 Press space to fly!</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const hintEl = document.getElementById('hint');

    // --- Game constants ---
    const STEP_MS = 1000 / 60; // fixed update rate, so 120Hz screens don't run double speed
    const GRAVITY = 0.2;
    const FLAP_STRENGTH = -5.5;
    const MAX_FALL_SPEED = 4;
    const WORLD_SPEED = 2.5;
    const ITEM_SPAWN_RATE = 70; // frames
    const ITEM_SIZE = 52;
    const RAINBOW_SIZE = 76;
    const RAINBOW_CHANCE = 0.4;
    const GROUND_ITEM_CHANCE = 0.3;
    const COLLECT_MARGIN = 30; // generous reach beyond the item's edge
    const TREATS = ['⭐', '💖', '🍭', '🧁', '🦋', '💎', '🍦', '🎈'];
    const GROUND_HEIGHT = 60;
    const FOOT_OFFSET = 18; // unicorn centre to hooves

    // --- State ---
    let frame = 0;
    let score = 0;
    let width, height;

    // --- Entities ---
    let unicorn = { x: 0, y: 0, w: 40, h: 30, vy: 0, angle: 0, flapTimer: 0, onGround: true };
    let items = [];
    let clouds = [];
    let particles = [];
    let popups = [];

    function groundLevel() {
      return height - GROUND_HEIGHT;
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      width = canvas.width;
      height = canvas.height;
      unicorn.x = width * 0.25;
      if (unicorn.onGround) unicorn.y = groundLevel() - FOOT_OFFSET;
    }
    window.addEventListener('resize', resize);
    resize();

    function spawnCloud(x) {
      clouds.push({
        x: x,
        y: Math.random() * height * 0.5,
        w: 60 + Math.random() * 80,
        speed: 0.5 + Math.random() * 0.5
      });
    }
    // initial clouds
    for (let i = 0; i < 6; i++) {
      spawnCloud(Math.random() * width);
    }

    function spawnItem() {
      const isRainbow = Math.random() < RAINBOW_CHANCE;
      const size = isRainbow ? RAINBOW_SIZE : ITEM_SIZE;
      const lowest = groundLevel() - size / 2 - 10;
      const highest = 70;
      // Some items sit low enough to collect while running
      const onGround = Math.random() < GROUND_ITEM_CHANCE;
      const y = onGround ? lowest : highest + Math.random() * (lowest - highest);
      items.push({
        x: width + size,
        y: y,
        size: size,
        emoji: isRainbow ? '🌈' : TREATS[Math.floor(Math.random() * TREATS.length)],
        bobPhase: Math.random() * Math.PI * 2
      });
    }

    function spawnParticles(x, y, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          life: 30 + Math.random() * 20,
          color: `hsl(${Math.random()*360},80%,70%)`,
          size: 3 + Math.random() * 4
        });
      }
    }

    function flap() {
      hintEl.classList.add('hidden');
      unicorn.vy = FLAP_STRENGTH;
      unicorn.flapTimer = 10;
      unicorn.onGround = false;
      spawnParticles(unicorn.x, unicorn.y + 10, 5);
    }

    function collect(item) {
      score++;
      scoreEl.textContent = score;
      spawnParticles(item.x, item.y, 16);
      popups.push({ x: item.x, y: item.y, life: 40 });
    }

    function update() {
      frame++;

      // Clouds
      clouds.forEach(c => c.x -= c.speed);
      if (clouds.length < 10 && Math.random() < 0.01) spawnCloud(width + 50);
      clouds = clouds.filter(c => c.x + c.w > -50);

      // Unicorn physics
      if (!unicorn.onGround) {
        unicorn.vy = Math.min(unicorn.vy + GRAVITY, MAX_FALL_SPEED);
        unicorn.y += unicorn.vy;
      }
      unicorn.angle = unicorn.onGround ? 0 : unicorn.vy * 0.05;
      if (unicorn.flapTimer > 0) unicorn.flapTimer--;

      // Ground landing
      if (unicorn.y + FOOT_OFFSET >= groundLevel()) {
        unicorn.y = groundLevel() - FOOT_OFFSET;
        unicorn.vy = 0;
        unicorn.onGround = true;
      }
      // Ceiling
      if (unicorn.y - unicorn.h/2 < 0) {
        unicorn.y = unicorn.h/2;
        unicorn.vy = 0;
      }

      // Items
      if (frame % ITEM_SPAWN_RATE === 0) spawnItem();
      items.forEach(item => {
        item.x -= WORLD_SPEED;
        item.y += Math.sin(frame * 0.06 + item.bobPhase) * 0.3;
      });
      const reached = item =>
        Math.hypot(item.x - unicorn.x, item.y - unicorn.y) < item.size / 2 + COLLECT_MARGIN;
      items.filter(reached).forEach(collect);
      items = items.filter(item => !reached(item) && item.x + item.size > 0);

      // Particles
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        p.size *= 0.95;
      });
      particles = particles.filter(p => p.life > 0);

      // Popups
      popups.forEach(p => {
        p.y -= 1;
        p.life--;
      });
      popups = popups.filter(p => p.life > 0);

      // Rainbow trail
      if (frame % 5 === 0) {
        particles.push({
          x: unicorn.x - 10,
          y: unicorn.y,
          vx: -1,
          vy: 0,
          life: 40,
          color: `hsl(${(frame * 2) % 360},80%,70%)`,
          size: 4
        });
      }
    }

    // --- Drawing ---
    function drawCloud(c) {
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.w * 0.3, 0, Math.PI * 2);
      ctx.arc(c.x + c.w * 0.25, c.y - c.w * 0.1, c.w * 0.35, 0, Math.PI * 2);
      ctx.arc(c.x + c.w * 0.5, c.y, c.w * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawGround() {
      const gh = GROUND_HEIGHT;
      const y = height - gh;
      ctx.fillStyle = '#8B5A2B';
      ctx.fillRect(0, y, width, gh);
      ctx.fillStyle = '#4CAF50';
      ctx.fillRect(0, y, width, 12);
      // stripes
      ctx.fillStyle = '#6D4C41';
      for (let i = -((frame * WORLD_SPEED) % 40); i < width; i += 40) {
        ctx.fillRect(i, y + 12, 20, gh - 12);
      }
    }

    function drawLeg(hipX, swing) {
      ctx.beginPath();
      ctx.moveTo(hipX, 8);
      ctx.lineTo(hipX + swing, FOOT_OFFSET - Math.abs(swing) * 0.4);
      ctx.stroke();
    }

    function drawLegs(u) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      if (u.onGround) {
        // Gallop
        const swing = Math.sin(frame * 0.35) * 8;
        drawLeg(-9, swing);
        drawLeg(-4, -swing);
        drawLeg(5, -swing);
        drawLeg(10, swing);
      } else {
        const legOffset = u.flapTimer > 0 ? -6 : 2;
        ctx.beginPath();
        ctx.moveTo(-5, 8);
        ctx.lineTo(-8, 16 + legOffset);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(5, 8);
        ctx.lineTo(8, 16 + legOffset);
        ctx.stroke();
      }
    }

    function drawWing(u) {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      if (u.onGround) {
        ctx.ellipse(-6, 0, 10, 6, 0.2, 0, Math.PI*2); // folded
      } else {
        ctx.ellipse(-5, 2, 8, 12, u.flapTimer > 0 ? -0.5 : 0.2, 0, Math.PI*2);
      }
      ctx.fill();
      ctx.strokeStyle = '#E1BEE7';
      ctx.lineWidth = 1;
      ctx.beginPath();
      if (u.onGround) {
        ctx.moveTo(-14, -1); ctx.lineTo(1, 2);
        ctx.moveTo(-13, 2); ctx.lineTo(0, 4);
      } else {
        ctx.moveTo(-10, -4); ctx.lineTo(-5, 14);
        ctx.moveTo(-7, -6); ctx.lineTo(-3, 12);
        ctx.moveTo(-4, -6); ctx.lineTo(0, 10);
      }
      ctx.stroke();
    }

    function drawUnicorn(u) {
      ctx.save();
      // Bounce along while galloping
      const bounce = u.onGround ? Math.abs(Math.sin(frame * 0.35)) * -2 : 0;
      ctx.translate(u.x, u.y + bounce);
      ctx.rotate(u.angle);

      // Body
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(0, 0, u.w/2, u.h/2, 0, 0, Math.PI*2);
      ctx.fill();

      // Head
      ctx.beginPath();
      ctx.ellipse(12, -6, 10, 9, 0, 0, Math.PI*2);
      ctx.fill();

      // Snout
      ctx.fillStyle = '#F8BBD0';
      ctx.beginPath();
      ctx.ellipse(18, -3, 6, 5, 0, 0, Math.PI*2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.arc(14, -8, 2.5, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(15, -9, 1, 0, Math.PI*2);
      ctx.fill();

      // Horn
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.moveTo(14, -14);
      ctx.lineTo(18, -28);
      ctx.lineTo(22, -14);
      ctx.closePath();
      ctx.fill();
      // Horn stripes
      ctx.strokeStyle = '#E65100';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(16, -19); ctx.lineTo(19, -19);
      ctx.moveTo(17, -23); ctx.lineTo(20, -23);
      ctx.stroke();

      // Mane
      ctx.fillStyle = '#E040FB';
      ctx.beginPath();
      ctx.arc(-2, -10, 7, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#00BCD4';
      ctx.beginPath();
      ctx.arc(-6, -6, 5, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#FF4081';
      ctx.beginPath();
      ctx.arc(-4, -2, 4, 0, Math.PI*2);
      ctx.fill();

      // Ear
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(8, -16, 3, 5, -0.3, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#F8BBD0';
      ctx.beginPath();
      ctx.ellipse(8, -16, 1.5, 3, -0.3, 0, Math.PI*2);
      ctx.fill();

      drawLegs(u);
      drawWing(u);

      ctx.restore();
    }

    function drawItem(item) {
      ctx.font = `${item.size}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(item.emoji, item.x, item.y);
    }

    function drawPopup(p) {
      ctx.globalAlpha = p.life / 40;
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 3;
      ctx.strokeText('+1', p.x, p.y);
      ctx.fillText('+1', p.x, p.y);
      ctx.globalAlpha = 1;
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Sky background is handled by CSS (gradient)
      clouds.forEach(drawCloud);

      // Ground
      drawGround();

      // Items
      items.forEach(drawItem);

      // Particles
      particles.forEach(p => {
        ctx.globalAlpha = p.life / 40;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // Unicorn
      drawUnicorn(unicorn);

      // Popups
      popups.forEach(drawPopup);
    }

    let lastTime = performance.now();
    let elapsed = 0;

    function loop(now) {
      elapsed += Math.min(now - lastTime, 100); // don't race to catch up after a hidden tab
      lastTime = now;
      while (elapsed >= STEP_MS) {
        update();
        elapsed -= STEP_MS;
      }
      draw();
      requestAnimationFrame(loop);
    }

    // --- Input ---
    window.addEventListener('keydown', (e) => {
      if (e.code !== 'Space') return;
      e.preventDefault();
      if (!e.repeat) flap();
    });
    window.addEventListener('pointerdown', flap);

    // Start loop
    requestAnimationFrame(loop);
  </script>
</body>
</html>
